openapi: 3.0.3
info:
  title: PetVerse API
  description: >
    API fictícia de uma clínica veterinária / petshop. Gerencia autenticação,
    tutores (owners), pets e agendamento de consultas (appointments).
    Esta especificação é a fonte de verdade usada para gerar/validar a
    collection Postman em `.postman/collections/PetVerse API`.
  version: "1.0.0"
  contact:
    name: Time de Plataforma - PetVerse
    email: platform@petverse.example.com
  license:
    name: MIT

servers:
  - url: https://api.petverse.example.com
    description: Produção
  - url: https://api.staging.petverse.example.com
    description: Staging
  - url: https://api.dev.petverse.example.com
    description: Desenvolvimento
  - url: http://localhost:3000
    description: Local

tags:
  - name: Auth
    description: Autenticação e ciclo de vida do token de acesso.
  - name: Owners
    description: Cadastro de tutores (donos dos pets).
  - name: Pets
    description: Cadastro e consulta de pets vinculados a um tutor.
  - name: Appointments
    description: Agendamento de consultas veterinárias.
  - name: System
    description: Endpoints de infraestrutura.

paths:
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Autentica um usuário
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: tutor@petverse.dev
              password: s3nha-super-secreta
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Renova o access_token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Invalida o refresh_token atual
      operationId: logout
      responses:
        '204':
          description: Logout realizado com sucesso

  /v1/owners:
    get:
      tags: [Owners]
      summary: Lista tutores
      operationId: listOwners
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Lista paginada de tutores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerList'
    post:
      tags: [Owners]
      summary: Cria um tutor
      operationId: createOwner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerInput'
      responses:
        '201':
          description: Tutor criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/owners/{ownerId}:
    parameters:
      - $ref: '#/components/parameters/OwnerId'
    get:
      tags: [Owners]
      summary: Busca um tutor pelo id
      operationId: getOwnerById
      responses:
        '200':
          description: Tutor encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Owners]
      summary: Remove um tutor
      operationId: deleteOwner
      responses:
        '204':
          description: Tutor removido
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/pets:
    get:
      tags: [Pets]
      summary: Lista pets
      operationId: listPets
      parameters:
        - name: species
          in: query
          schema:
            type: string
            enum: [dog, cat, bird, other]
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Lista paginada de pets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetList'
    post:
      tags: [Pets]
      summary: Cria um pet
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetInput'
      responses:
        '201':
          description: Pet criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/pets/{petId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Pets]
      summary: Busca um pet pelo id
      operationId: getPetById
      responses:
        '200':
          description: Pet encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Pets]
      summary: Atualiza um pet
      operationId: updatePet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetUpdate'
      responses:
        '200':
          description: Pet atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Pets]
      summary: Remove um pet
      operationId: deletePet
      responses:
        '204':
          description: Pet removido
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/appointments:
    get:
      tags: [Appointments]
      summary: Lista consultas
      operationId: listAppointments
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AppointmentStatus'
      responses:
        '200':
          description: Lista de consultas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentList'
    post:
      tags: [Appointments]
      summary: Agenda uma consulta
      operationId: createAppointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentInput'
      responses:
        '201':
          description: Consulta agendada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/appointments/{appointmentId}:
    parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Appointments]
      summary: Cancela uma consulta
      operationId: cancelAppointment
      responses:
        '204':
          description: Consulta cancelada
        '404':
          $ref: '#/components/responses/NotFound'

  /health:
    get:
      tags: [System]
      summary: Health check da API
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: API saudável
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptimeSeconds:
                    type: integer

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 20
    OwnerId:
      name: ownerId
      in: path
      required: true
      schema:
        type: string
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Credenciais inválidas ou token ausente/expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer

    Owner:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        createdAt:
          type: string
          format: date-time

    OwnerInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string

    OwnerList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Owner'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    Pet:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        species:
          type: string
          enum: [dog, cat, bird, other]
        breed:
          type: string
        birthDate:
          type: string
          format: date
        weightKg:
          type: number
        ownerId:
          type: string
        createdAt:
          type: string
          format: date-time

    PetInput:
      type: object
      required: [name, species, ownerId]
      properties:
        name:
          type: string
        species:
          type: string
          enum: [dog, cat, bird, other]
        breed:
          type: string
        birthDate:
          type: string
          format: date
        ownerId:
          type: string

    PetUpdate:
      type: object
      properties:
        name:
          type: string
        breed:
          type: string
        weightKg:
          type: number

    PetList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    AppointmentStatus:
      type: string
      enum: [scheduled, completed, cancelled]

    Appointment:
      type: object
      properties:
        id:
          type: string
        petId:
          type: string
        vetId:
          type: string
        scheduledAt:
          type: string
          format: date-time
        reason:
          type: string
        status:
          $ref: '#/components/schemas/AppointmentStatus'

    AppointmentInput:
      type: object
      required: [petId, vetId, scheduledAt]
      properties:
        petId:
          type: string
        vetId:
          type: string
        scheduledAt:
          type: string
          format: date-time
        reason:
          type: string

    AppointmentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'

security:
  - bearerAuth: []
