$kind: http-request
url: "{{base_url}}/{{api_version}}/appointments/:appointmentId"
method: DELETE
pathVariables:
  appointmentId: "{{appointment_id}}"
scripts:
  - type: afterResponse
    code: pm.test('Consulta cancelada com 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 3000
