name: fern-check

on:
  pull_request:
    paths:
      - "fern/**"
      - "postman/specs/openapi.yaml"
      - ".github/workflows/fern-check.yml"
  push:
    branches: [main]
    paths:
      - "fern/**"
      - "postman/specs/openapi.yaml"
      - ".github/workflows/fern-check.yml"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Fern CLI
        uses: fern-api/setup-fern-cli@v1

      - name: Validar config da Fern + definição da API
        run: fern check
