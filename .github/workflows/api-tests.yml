name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint collection & OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - name: Lint da collection (v3 / git-native), da spec OpenAPI e alinhamento entre as duas
        run: bash scripts/lint.sh
      - run: npm install
      - name: Regenerar o espelho v2.1 (dist/) e falhar se estiver desatualizado
        run: |
          npm run export:v2
          git diff --exit-code -- dist/ || {
            echo "::error::dist/ está desatualizado — rode 'npm run export:v2' e commite o resultado.";
            exit 1;
          }

  run-collection:
    name: Run collection against local mock
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Subir o mock local (postman/mocks/petverse-api) na porta 3000
        # 3000 é a base_url do ambiente "Local"
        # (postman/environments/PetVerse API - Local.environment.yaml).
        run: |
          PORT=3000 node "postman/mocks/petverse-api/default.js" &
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/health > /dev/null && break
            sleep 0.5
          done
          curl -sf http://localhost:3000/health || { echo "::error::mock não respondeu"; exit 1; }
      - name: Rodar a collection PetVerse API contra o mock
        run: bash scripts/run-collection.sh Local cli
