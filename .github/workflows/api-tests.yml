name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint collection & OpenAPI spec
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necessário só pro auto-commit do dist/ em push na main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml jsonschema
      - name: Lint da collection (v3 / git-native), da spec OpenAPI e alinhamento entre as duas
        run: bash scripts/lint.sh
      - run: npm install
      - name: Regenerar o espelho v2.1 (dist/)
        run: npm run export:v2
      - name: Auto-commit o dist/ regenerado (só em push direto na main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- dist/; then
            echo "dist/ já estava atualizado, nada a commitar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "chore: regenerar dist/ (espelho v2.1) [skip ci]"
          git push
      - name: Falhar se dist/ estiver desatualizado (PRs -- não commitamos em branch alheia)
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code -- dist/ || {
            echo "::error::dist/ está desatualizado — rode 'npm run export:v2' e commite o resultado.";
            exit 1;
          }

  run-collection:
    name: Run collection against local mock
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Subir o mock local (postman/mocks/petverse-api)
        # A porta não é fixa aqui de propósito: config.yaml (editável pela UI
        # do Postman) é a fonte de verdade de em que porta o mock escuta.
        # O ambiente "Local" (base_url) precisa apontar pra essa mesma porta
        # -- se alguém mudar uma sem a outra, este passo falha alto e claro
        # em vez de silenciosamente testar contra a porta errada.
        run: |
          MOCK_PORT=$(grep -oP '^port:\s*\K\d+' "postman/mocks/petverse-api/config.yaml")
          ENV_PORT=$(grep -oP 'localhost:\K\d+' "postman/environments/PetVerse API - Local.environment.yaml")
          if [ "$MOCK_PORT" != "$ENV_PORT" ]; then
            echo "::error::Porta do mock (config.yaml: $MOCK_PORT) diverge da base_url do ambiente Local ($ENV_PORT). Alinhe os dois antes de continuar."
            exit 1
          fi
          echo "Usando porta $MOCK_PORT (mock e ambiente Local concordam)"
          PORT="$MOCK_PORT" node "postman/mocks/petverse-api/default.js" &
          for i in $(seq 1 20); do
            curl -sf "http://localhost:$MOCK_PORT/health" > /dev/null && break
            sleep 0.5
          done
          curl -sf "http://localhost:$MOCK_PORT/health" || { echo "::error::mock não respondeu"; exit 1; }
      - name: Rodar a collection PetVerse API contra o mock
        run: bash scripts/run-collection.sh Local cli
