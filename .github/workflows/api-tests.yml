name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint collection & OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - name: Lint da collection (v3 / git-native), da spec OpenAPI e alinhamento entre as duas
        run: bash scripts/lint.sh
      - run: npm install
      - name: Regenerar o espelho v2.1 (dist/) e falhar se estiver desatualizado
        run: |
          npm run export:v2
          git diff --exit-code -- dist/ || {
            echo "::error::dist/ está desatualizado — rode 'npm run export:v2' e commite o resultado.";
            exit 1;
          }

  run-collection:
    name: Run collection against mock/local env
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rodar a collection PetVerse API
        run: bash scripts/run-collection.sh Local cli
        # Em um repositório real, aponte o ambiente "Local" para um servidor
        # mock/stub subido neste mesmo job (ex.: Prism a partir de postman/specs/openapi.yaml)
        # antes de rodar este passo.
