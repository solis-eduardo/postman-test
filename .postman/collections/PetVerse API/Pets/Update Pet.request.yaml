$kind: http-request
url: "{{base_url}}/{{api_version}}/pets/:petId"
method: PUT
headers:
  Content-Type: application/json
pathVariables:
  petId: "{{pet_id}}"
body:
  type: text
  content: |-
    {
      "name": "Rex",
      "breed": "Labrador Retriever",
      "weightKg": 28.5
    }
scripts:
  - type: afterResponse
    code: pm.test('Pet atualizado com 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
